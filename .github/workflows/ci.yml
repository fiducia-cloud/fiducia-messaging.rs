name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
          submodules: recursive
      - name: Validate GitHub Actions
        uses: docker://rhysd/actionlint@sha256:b1934ee5f1c509618f2508e6eb47ee0d3520686341fec936f3b79331f9315667
        with:
          args: ./.github/workflows/ci.yml ./.github/workflows/cli-flags.yml
      - uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30 # stable
        with:
          toolchain: "1.95.0"
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@f0d9c3887740aee45f6153b24b3a6b815192ec16 # v2
      - name: CLI flag contract
        run: |
          make -B -C vendor/flags-2-env all
          vendor/flags-2-env/build/flags2env audit .cli-flags.toml
      - run: cargo fmt --all -- --check
      - run: cargo clippy --all-targets --all-features --locked -- -D warnings
      - run: cargo test --all-targets --all-features --locked
      - uses: taiki-e/install-action@37f7c5781271959fb65b6b35224e28652ff2b63d # v2
        with:
          tool: cargo-audit@0.22.2
      - name: Prove advisory package is absent from the feature-unified build tree
        run: |
          set -euo pipefail
          tree_file="${RUNNER_TEMP}/cargo-tree.txt"
          cargo tree \
            --locked \
            --all-features \
            --target all \
            --edges normal,build,dev \
            --prefix none \
            --format '{p}' \
            > "${tree_file}"
          if grep -Fqx 'rkyv v0.7.46' "${tree_file}"; then
            cargo tree \
              --locked \
              --all-features \
              --target all \
              --edges features \
              --invert rkyv@0.7.46 || true
            echo 'RUSTSEC-2026-0235 is reachable in the feature-unified build tree' >&2
            exit 1
          fi
          echo 'rkyv 0.7.46 is lock metadata only; Cargo does not build it for any target'
      - name: Audit the lock after the reachability proof
        run: cargo audit --ignore RUSTSEC-2026-0235
